<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const OPS=['Plus','Minus','Gemischt'],RGN=[10,20,100,1000],NUM=[5,10,15,20];
const def={mode:0,rg:1,help:true,n:10};
let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem('rt1')||'{}'))}catch(e){S=Object.assign({},def)}
const save=()=>{try{localStorage.setItem('rt1',JSON.stringify(S))}catch(e){}};
// Zerlegung beim Zehnerübergang: Die erste Zahl macht die Zehn voll (Plus) oder geht bis zur vollen Zehn zurück (Minus).
function info(a,b,k){const o=a%10;
 if(k=='+'){if(o>0&&o+b%10>=10){const c=10-o;if(b>c)return{c,rest:b-c,mid:a+c}}}
 else if(o>0&&o<b%10)return{c:o,rest:b-o,mid:a-o};
 return null}
// Aufgaben: bei Minus ist a immer größer als b, das Ergebnis also nie negativ.
function gen(){
 const m=RGN[S.rg],k=S.mode==2?(Math.random()<.5?'+':'−'):'+−'[S.mode],help=S.help&&m>10,lo=m>=1000?100:m>=100?10:1,want=help&&Math.random()<.65;let a,b;
 for(let n=0;n<400;n++){
  if(m==10){if(k=='+'){a=R(1,9);b=R(1,10-a)}else{a=R(2,10);b=R(1,a-1)}break}
  if(help){b=R(1,9);if(k=='+')a=R(lo,m-b);else a=R(Math.max(lo,b+1),m)}
  else if(k=='+'){a=R(lo,m-1);b=R(1,m-a)}else{a=R(Math.max(lo,2),m);b=R(1,a-1)}
  if(help){const i=info(a,b,k);if(want!==!!i)continue;if(k=='−'&&!i&&a%10==0)continue}
  break}
 return{a,b,k,m,r:k=='+'?a+b:a-b,inf:info(a,b,k)}}
function newTasks(){const L=[],seen=new Set();for(let i=0;i<S.n;i++){let t,tries=0;do{t=gen();tries++}while(seen.has(t.a+t.k+t.b)&&tries<30);seen.add(t.a+t.k+t.b);L.push(t)}return L}
// Hilfe: kurze Hinweise in drei Stufen, passend zum aktuellen Schritt
function hintList(){
 const t=G.t,{a,b,k,r,inf}=t,sp=G.sp,bt=b-b%10,bo=b%10,op=k;
 if(inf&&S.help&&t.m>10){
  if(!sp.open)return[`Teile die ${b} in zwei Zahlen. Tippe auf die ${b}.`,`Mach zuerst die Zehn voll: ${a} ${op} ? = ${inf.mid}.`,`Teile ${b} in ${inf.c} und ${inf.rest}.`];
  if(!sp.valid)return[`Die zwei Zahlen müssen zusammen ${b} ergeben.`,`Eine Zahl macht die Zehn voll: ${a} ${op} ? = ${inf.mid}.`,`Du brauchst ${inf.c} und ${inf.rest}.`];
  if(!G.mOk)return[`Rechne ${a} ${op} ${inf.c}.`,`${a} ${op} ${inf.c} = ${inf.mid}.`];
  return[`Jetzt rechnest du ${inf.mid} ${op} ${inf.rest}.`,`${inf.mid} ${op} ${inf.rest} = ${r}.`]}
 if(inf)return[`Mach zuerst die Zehn voll.`,`${a} ${op} ${inf.c} = ${inf.mid}. Dann noch ${op} ${inf.rest}.`,`${inf.mid} ${op} ${inf.rest} = ${r}.`];
 if(k=='−'&&a%10==0&&bo>0)return[`Löse eine Zehn auf: 10 − ${bo} = ${10-bo}.`,`Rechne zuerst ${a} − ${bt}, dann noch − ${bo}.`,`Ergebnis: ${r}.`];
 if(b>=10&&bo>0)return[`Rechne erst die Zehner, dann die Einer.`,`${a} ${op} ${bt} = ${k=='+'?a+bt:a-bt}. Dann noch ${op} ${bo}.`,`Ergebnis: ${r}.`];
 if(b>=10)return[`Rechne mit ganzen Zehnern.`,`Ergebnis: ${r}.`];
 if(t.m==10)return[`Zähle ${b} ${k=='+'?'weiter':'zurück'}.`,`${a} ${op} ${b} = ${r}.`];
 return[`Hier gibt es keinen Zehnerübergang. Rechne nur die Einer: ${a%10} ${op} ${b}.`,`Die Zehner bleiben gleich.`,`${a} ${op} ${b} = ${r}.`]}

// Zahlenstrahl: maßstabsgetreu mit Strichen (Einer klein, Fünfer länger, Zehner beschriftet).
// Sprünge erscheinen nacheinander: nach richtigem Ergebnis, nach Hilfe oder wenn die Aufgabe gelöst ist.
function nlData(t){
 const {a,b,k,r,inf}=t,bt=b-b%10,bo=b%10,sg=k=='+'?1:-1;
 if(inf)return{p:[a,inf.mid,r],j:[sg*inf.c,sg*inf.rest],tree:true};
 if(k=='−'&&a%10==0&&bo>0)return b<10?{p:[a,a-10,r],j:[-10,10-bo]}:{p:[a,a-bt,r],j:[-bt,-bo]};
 if(b>=10&&bo>0)return{p:[a,a+sg*bt,r],j:[sg*bt,sg*bo]};
 return{p:[a,r],j:[sg*b]}}
const nlVis=d=>d.j.map((_,i)=>!!(G.done||i<(G.rev||0)||(d.tree&&G.mOk&&i==0)));
function nlReveal(){const n=nlData(G.t).j.length;
 if(can()&&G.sp.valid)G.rev=Math.max(G.rev||0,G.mOk?2:1);
 else if(!can())G.rev=Math.max(G.rev||0,Math.min(n,G.hi))}
function nlSVG(){
 const d=nlData(G.t),vis=nlVis(d),P=d.p,mix=d.j.length==2&&Math.sign(d.j[0])!=Math.sign(d.j[1]);
 const mn=Math.min(...P),mx=Math.max(...P);
 let lo=Math.floor(mn/10)*10,hi=Math.ceil(mx/10)*10;if(mn%10==0)lo-=10;if(mx%10==0)hi+=10;lo=Math.max(lo,0);
 const span=hi-lo,fine=span<=60,LB=span<=120?10:100,step=fine?1:span<=450?10:50,X=v=>14+(v-lo)/span*272,base=46,
  cols=['var(--j1)','var(--j2)'],known=P.map((_,i)=>i==0||vis[i-1]),isLab=v=>fine?v%10==0:v%LB==0,f=v=>v<0?'−'+(-v):'+'+v;
 // Zeilen der Punktbeschriftung (unabhängig vom Lösungsstand, damit nichts springt)
 const rows=[];let lx=-99,lr=2,use3=false;
 P.map((v,i)=>[X(v),i]).sort((p,q)=>p[0]-q[0]).forEach(([x,i])=>{
  if(isLab(P[i])){rows[i]=0;return}
  const r=x-lx<30?(lr==1?2:1):1;rows[i]=r;lx=x;lr=r;if(r==2)use3=true});
 const y1=base+21,y2=base+38,y3=base+57,rb=base+(use3?63:44),ys=(use3?y3:y2)+9,H=mix?ys+11+20:rb;
 const hl={};P.forEach((v,i)=>{if(known[i])hl[v]=i==0?'var(--ink)':cols[i-1]});
 let o=`<svg class="nls${mix?' mix':''}" style="--k:${(H/94).toFixed(3)}" viewBox="0 0 300 ${H}" role="img" aria-label="Zahlenstrahl mit ${d.j.length==1?'einem Sprung':'zwei Sprüngen'}"><line x1="6" y1="${base}" x2="294" y2="${base}" stroke="var(--mut)" stroke-width="2.5" stroke-linecap="round"/>`;
 for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){
  const x=X(v),lab=isLab(v),len=lab?16:(fine?v%5==0:v%50==0)?11:6,sw=lab?2.6:len==11?2.1:1.5;
  o+=`<line x1="${x}" y1="${base-len/2}" x2="${x}" y2="${base+len/2}" stroke="var(--mut)" stroke-width="${sw}" stroke-linecap="round"/>`;
  if(lab)o+=`<text x="${x}" y="${y1}" text-anchor="middle" font-size="${hl[v]?14:12.5}" font-weight="${hl[v]?800:600}" fill="${hl[v]||'var(--mut)'}">${v}</text>`}
 P.forEach((v,i)=>{if(!known[i])return;const c=i==0?'var(--ink)':cols[i-1],x=X(v);
  o+=`<circle cx="${x}" cy="${base}" r="5" fill="${c}"/>`;
  if(rows[i])o+=`<text x="${x}" y="${rows[i]==1?y2:y3}" text-anchor="middle" font-size="14.5" font-weight="800" fill="${c}">${v}</text>`});
 d.j.forEach((v,i)=>{if(!vis[i])return;
  const x1=X(P[i]),x2=X(P[i+1]),below=mix&&i==1,w=Math.abs(x2-x1),h=below?11:Math.min(19,Math.max(9,w*.35)),cx=(x1+x2)/2,
   sy=below?ys:base-5,cy=below?sy+2*h:sy-2*h,c=cols[i],L=Math.min(9,Math.max(4,w*.45)),ang=Math.atan2(sy-cy,x2-cx),
   p1=[x2-L*Math.cos(ang-.5),sy-L*Math.sin(ang-.5)],p2=[x2-L*Math.cos(ang+.5),sy-L*Math.sin(ang+.5)],ly=below?sy+h+14:sy-h-4;
  o+=`<path d="M${x1} ${sy} Q${cx} ${cy} ${x2} ${sy}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path d="M${x2} ${sy} L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}Z" fill="${c}" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/><text x="${cx}" y="${ly}" text-anchor="middle" font-size="15" font-weight="800" fill="${c}">${f(v)}</text>`});
 return o+'</svg>'}
let G=null;
function menu(){
 G=null;const no=RGN[S.rg]==10;
 app.innerHTML=`<h1>Rechentrainer</h1><p class="lead">Addition und Subtraktion üben. Bitte vor dem Start einstellen.</p>
 <h2 style="--c:var(--acc)">Rechenart</h2><div class="seg s3" role="group" aria-label="Rechenart" data-c="b">${OPS.map((o,i)=>`<button class="sg" data-m="${i}" aria-pressed="${S.mode==i}">${o}</button>`).join('')}</div>
 <h2 style="--c:#d9640f">Zahlenraum</h2><div class="seg s4" role="group" aria-label="Zahlenraum" data-c="o">${RGN.map((r,i)=>`<button class="sg" data-r="${i}" aria-pressed="${S.rg==i}">bis ${r}</button>`).join('')}</div>
 <h2 style="--c:#8a45c7">Hilfe beim Zehnerübergang</h2><div class="seg s2" role="group" aria-label="Hilfe beim Zehnerübergang" data-c="p"><button class="sg" data-h="1" aria-pressed="${S.help&&!no}" ${no?'disabled':''}>Ja</button><button class="sg" data-h="0" aria-pressed="${!S.help||no}">Nein</button></div>
 <p class="note">${no?'Im Zahlenraum bis 10 gibt es keinen Zehnerübergang.':'Bei „Ja“ können die Kinder die zweite Zahl in zwei Teile zerlegen, wenn die Aufgabe einen Zehnerübergang hat. Die erste Zahl füllt die Zehn voll, die zweite ist der Rest.'}</p>
 <h2 style="--c:#1f8a4c">Anzahl der Aufgaben</h2><div class="seg s4" role="group" aria-label="Anzahl" data-c="g">${NUM.map(n=>`<button class="sg" data-n="${n}" aria-pressed="${S.n==n}">${n}</button>`).join('')}</div>
 <button class="primary" id="go">Starten</button>`;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=+b.dataset.m;save();menu()});app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rg=+b.dataset.r;save();menu()});
 app.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.help=b.dataset.h=='1';save();menu()});app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;save();menu()});
 $('#go').onclick=start}
function start(){G={tasks:newTasks(),i:0,res:[]};load()}
function load(){const t=G.tasks[G.i];Object.assign(G,{t,v:{ans:'',f1:'',f2:'',m:'',r:''},act:'ans',sp:{open:false,valid:false},mOk:false,done:false,tries:0,helped:false,hi:0,stage:'',msg:null,nl:false,rev:0});draw()}
const can=()=>S.help&&G.t.m>10&&G.t.inf;
function fld(name,cls=''){const j=name=='m'?'j1':name=='r'?'j2':G.sp.valid&&name=='f1'?'j1':G.sp.valid&&name=='f2'?'j2':'',v=G.v[name],ok=(name=='f1'||name=='f2')?G.sp.valid:name=='m'?G.mOk:(name=='ans'||name=='r')&&G.done;return`<button class="fld ${cls} ${j} ${G.act==name&&!ok&&!G.done?'act':''} ${ok?'ok':''}" data-f="${name}" aria-label="Eingabefeld">${v}</button>`}
function draw(){
 const t=G.t,{a,b,k,inf}=t,sp=G.sp,tree=sp.open;
 const bHTML=can()?`<span class="bw"><button class="n sp" id="bb" aria-label="Zahl ${b} in zwei Zahlen teilen">${b}</button>${tree?'':'<small class="cap">teilen</small>'}</span>`:`<span class="n">${b}</span>`;
 const main=tree?`<span class="n">?</span>`:fld('ans');
 const steps=sp.valid?`<div class="steps"><div class="st"><small>Schritt 1</small><span>${a} ${k} <b class="j1">${inf.c}</b> =</span>${fld('m','sm')}</div><div class="st"><small>Schritt 2</small><span>${G.mOk?inf.mid:'…'} ${k} <b class="j2">${inf.rest}</b> =</span>${fld('r','sm')}</div></div>`:'';
 app.innerHTML=`<div class="play${G.nl?' wnl':''}"><div class="pl"><div class="head noprint"><button id="ex">Beenden</button><span>Aufgabe ${G.i+1} von ${G.tasks.length}</span><span style="width:84px"></span></div><div class="bar" aria-hidden="true"><i style="width:${G.i/G.tasks.length*100}%"></i></div>
 <div class="card"><div class="eq${can()&&!tree?' hascap':''}" aria-label="${a} ${k=='+'?'plus':'minus'} ${b}"><span class="n">${a}</span><span class="op">${k}</span>${bHTML}<span class="op">=</span>${main}</div>${tree?`<div class="treebox" id="tb"><svg aria-hidden="true"><line/><line/></svg><div class="tw" id="tw1">${fld('f1','sm')}</div><div class="tw" id="tw2">${fld('f2','sm')}</div></div>`:''}${steps}${G.nl?`<div class="nlw">${nlSVG()}</div>`:''}</div>
 <div class="msg ${G.msg?G.msg[1]:'info'}" id="msg" aria-live="polite">${G.msg?G.msg[0]:(can()&&!tree?'Tippe auf die '+b+', um sie zu teilen. Du kannst auch direkt rechnen.':S.help&&t.m>10&&!t.inf?'Hier gibt es keinen Zehnerübergang. Rechne direkt.':'Gib das Ergebnis ein und tippe auf OK.')}</div>
 </div><div class="pr">${G.done?`<button class="next" id="nx">${G.i+1<G.tasks.length?'Nächste Aufgabe':'Fertig'}</button>`:`<div class="tools${tree?' t3':''}"><button class="help" id="hp">Hilfe</button><button class="help" id="nlb" aria-pressed="${G.nl}">Zahlenstrahl</button><button class="help" id="un" ${tree?'':'hidden'}>Teilung entfernen</button></div>`}
 <div class="pad ${G.done?'off':''}" aria-label="Tastenfeld">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="k" data-k="${n}">${n}</button>`).join('')}<button class="k" data-k="x" aria-label="Löschen">⌫</button><button class="k" data-k="0">0</button><button class="k ok" data-k="ok">OK</button></div></div></div>`;
 $('#ex').onclick=menu;if($('#bb'))$('#bb').onclick=openSplit;if($('#hp'))$('#hp').onclick=help;if($('#nlb'))$('#nlb').onclick=()=>{G.nl=!G.nl;if(G.nl&&!G.done)G.helped=true;draw()};if($('#un'))$('#un').onclick=()=>{G.sp={open:false,valid:false};G.mOk=false;G.v.f1=G.v.f2=G.v.m=G.v.r='';G.act='ans';G.msg=null;draw()};if($('#nx'))$('#nx').onclick=nextTask;
 app.querySelectorAll('.fld').forEach(f=>f.onclick=()=>{if(!G.done){G.act=f.dataset.f;draw()}});app.querySelectorAll('.k').forEach(b=>b.onclick=()=>key(b.dataset.k));
 layoutTree()}
function layoutTree(){
 const tb=$('#tb'),bb=$('#bb');if(!tb||!bb)return;
 const t1=$('#tw1'),t2=$('#tw2'),W=tb.clientWidth,tr=tb.getBoundingClientRect(),br=bb.getBoundingClientRect(),bx=br.left+br.width/2-tr.left;
 const w1=t1.offsetWidth,w2=t2.offsetWidth,sep=10;
 let c1=bx-Math.max(64,w1/2+sep/2+14),c2=bx+Math.max(64,w2/2+sep/2+14);
 if(c2-c1<(w1+w2)/2+sep){const m=(c1+c2)/2,d=((w1+w2)/2+sep)/2;c1=m-d;c2=m+d}
 if(c1<w1/2+4){const d=w1/2+4-c1;c1+=d;c2+=d}
 if(c2>W-w2/2-4){const d=c2-(W-w2/2-4);c1-=d;c2-=d}
 if(c1<w1/2+4)c1=w1/2+4;
 const L=tb.querySelectorAll('line'),LH=tb.querySelector('svg').getBoundingClientRect().height,set=(l,x2)=>{l.setAttribute('x1',bx);l.setAttribute('y1',2);l.setAttribute('x2',x2);l.setAttribute('y2',LH)};set(L[0],c1);set(L[1],c2);
 t1.style.left=c1+'px';t2.style.left=c2+'px'}
function openSplit(){if(G.done)return;if(!G.sp.open){G.sp.open=true;G.act='f1';G.msg=['Teile die '+G.t.b+' in zwei Zahlen. Tippe auf ein Feld und gib eine Zahl ein.','info']}draw()}
function say(t,c){G.msg=[t,c];draw()}
function key(k){
 if(G.done)return;if(k=='ok')return check();
 const f=G.act;if(k=='x')G.v[f]=G.v[f].slice(0,-1);else if(G.v[f].length<4)G.v[f]+=k;
 draw()}
function check(){
 const t=G.t,{a,b,k,r,inf}=t,v=G.v,f=G.act;
 if(f=='f1'||f=='f2'){
  if(v.f1===''||v.f2===''){const e=v.f1===''?'f1':'f2';G.act=e;return say('Fülle beide Felder aus.','info')}
  const x=+v.f1,y=+v.f2,s=x+y;
  if(s!=b)return say(`Das passt nicht: ${x} + ${y} = ${s}. Die zwei Zahlen müssen zusammen ${b} ergeben. Sie sind zusammen zu ${s>b?'groß':'klein'}.`,'err');
  if(x!=inf.c&&y!=inf.c)return say(`Das passt zusammen. Aber eine Zahl soll die Zehn voll machen: ${a} ${k} ? = ${inf.mid}.`,'err');
  if(+v.f1!=inf.c){const q=v.f1;v.f1=v.f2;v.f2=q}G.sp.valid=true;G.act='m';return say('Richtig geteilt. Rechne jetzt Schritt 1.','ok')}
 if(v[f]==='')return say('Gib zuerst eine Zahl ein.','info');
 const val=+v[f];
 if(f=='m'){if(val==inf.mid){G.mOk=true;G.act='r';return say(`Richtig: ${a} ${k} ${inf.c} = ${inf.mid}. Weiter mit Schritt 2.`,'ok')}v.m='';return say(`Das stimmt nicht. Rechne ${a} ${k} ${inf.c}.`,'err')}
 if(val==r){G.done=true;G.res.push({t,ok:G.tries==0&&!G.helped,tries:G.tries,helped:G.helped});v.ans=v.r=String(r);return say('Richtig.','ok')}
 G.tries++;v[f]='';
 say(f=='r'?`Das stimmt noch nicht. Rechne ${inf.mid} ${k} ${inf.rest}.`:'Das stimmt noch nicht. Versuche es noch einmal oder tippe auf „Hilfe“.','err')}
function help(){
 if(G.done)return;const L=hintList(),sg=''+G.sp.open+G.sp.valid+G.mOk;if(G.stage!==sg){G.stage=sg;G.hi=0}
 const h=L[Math.min(G.hi,L.length-1)];G.hi++;G.helped=true;nlReveal();say('Hilfe: '+h,'hint')}
function nextTask(){G.i++;if(G.i>=G.tasks.length)return end();load()}
function end(){
 const ok=G.res.filter(x=>x.ok).length,n=G.res.length;
 app.innerHTML=`<h1>Geschafft</h1><p class="lead">${ok} von ${n} Aufgaben ohne Fehler und ohne Hilfe gelöst.</p>
 <table><thead><tr><th>Aufgabe</th><th>Ergebnis</th><th>Bearbeitung</th></tr></thead><tbody>${G.res.map(x=>`<tr><td>${x.t.a} ${x.t.k} ${x.t.b}</td><td>${x.t.r}</td><td>${x.ok?'ohne Hilfe':x.helped&&!x.tries?'mit Hilfe':x.helped?'mit Hilfe, '+x.tries+' Fehlversuch'+(x.tries>1?'e':''):x.tries+' Fehlversuch'+(x.tries>1?'e':'')}</td></tr>`).join('')}</tbody></table>
 <button class="primary noprint" id="ag">Noch einmal</button><button class="sec noprint" id="pr">Drucken</button><button class="sec noprint" id="mn">Zurück zum Startmenü</button>`;
 $('#ag').onclick=start;$('#mn').onclick=menu;$('#pr').onclick=()=>window.print()}
addEventListener('keydown',e=>{if(!G||!G.t)return;if(G.done){if(e.key=='Enter'){e.preventDefault();nextTask()}return}if(/^\d$/.test(e.key))key(e.key);else if(e.key=='Backspace')key('x');else if(e.key=='Enter')check()});
addEventListener('resize',layoutTree);
window.RT={gen,info,S:()=>S,G:()=>G,newTasks};menu();
</script></body></html>
